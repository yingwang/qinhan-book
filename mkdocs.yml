site_name: 秦汉那些事儿：帝国初生的四百年
site_description: 一部用现代白话拆解中华第一帝国兴衰的长篇历史书（前259—公元220）
site_author: Ying Wang
site_url: https://yingwang.github.io/qinhan-book/
repo_url: https://github.com/yingwang/qinhan-book
repo_name: yingwang/qinhan-book

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: red
      toggle:
        icon: material/brightness-7
        name: 切到夜间模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/brightness-4
        name: 切到日间模式
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight

nav:
  - 首页: index.md
  - 总纲与设定:
    - 全书总纲与人物志: 00-outline.md
  - 第一卷 铁血大秦:
    - 第 1 章 从邯郸肉票到千古一帝: 01-qin-shihuang.md
    - 第 2 章 失控的战车与沙丘鲍鱼: 02-shaqiu-collapse.md
    - 第 3 章 大泽乡的泥水与乱世合伙人: 03-dazexiang-uprising.md
  - 第二卷 楚汉惊雷:
    - 第 4 章 鸿门宴上的微表情与暗度陈仓: 04-hongmen-chencang.md
    - 第 5 章 打不死的刘邦与韩信封神: 05-pengcheng-hanxin.md
    - 第 6 章 霸王别姬与未央宫的杀机: 06-gaixia-weiyang.md
  - 第三卷 文景韬晦:
    - 第 7 章 吕后铁腕与代王进京: 07-lvhou-daiwang.md
    - 第 8 章 抠门天子与七国烽烟: 08-wenjing-qiguo.md
  - 第四卷 汉武铁骑:
    - 第 9 章 少年刘彻的野心与独尊儒术: 09-liuche-weixing.md
    - 第 10 章 双星闪耀与封狼居胥: 10-weihuo-mobei.md
    - 第 11 章 凿空西域与算盘上的帝国: 11-zhangqian-shiji.md
    - 第 12 章 巫蛊血案与轮台罪己: 12-wugu-luntai.md
    - 第 13 章 权臣霍光与病已逆袭: 13-huoguang-xuandi.md
  - 第五卷 日落西京与光武重光:
    - 第 14 章 柔弱天子与王氏坐大: 14-yuandi-wangshi.md
    - 第 15 章 穿越者王莽的魔幻乌托邦: 15-wangmang-utopia.md
    - 第 16 章 庄稼汉刘秀与昆阳神迹: 16-liuxiu-kunyang.md
    - 第 17 章 云台将星与柔道治国: 17-yuntai-roudao.md
    - 第 18 章 明章之治与班超孤悬绝域: 18-mingzhang-banchao.md
  - 第六卷 东京残照:
    - 第 19 章 短命皇帝与外戚宦官轮盘赌: 19-waiqi-huanguan.md
    - 第 20 章 清流热血与党锢绝响: 20-qingliu-danggu.md
    - 第 21 章 黄巾惊雷与董卓焚洛: 21-huangjin-dongzhuo.md
    - 第 22 章 长安废墟与许昌棋局: 22-changan-xuchang.md
    - 第 23 章 衣带诏与荀彧之死: 23-yidai-xunyu.md
    - 第 24 章 受禅台上的背影与四百年回响: 24-shouchantai-finale.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang:
        - zh
        - en

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yingwang
